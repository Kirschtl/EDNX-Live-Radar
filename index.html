<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>EDNX Live Radar v6</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
 integrity="sha256-p4NxAoJBhIINfQ3ynZsoMZ7SUKMZeklaodGmR3fvb4A=" crossorigin=""/>

<style>
:root{
  --bg:#010301;
  --panel:#020702;
  --grid:#1a4a26;
  --grid2:#347343;
  --text:#9cff81;
  --muted:#6f9f70;
  --bright:#b5ff98;
  --error:#ff7777;
}
*{box-sizing:border-box}
html,body{
  margin:0;height:100%;
  background:var(--bg);
  color:var(--text);
  font-family:Consolas,Menlo,Monaco,"Courier New",monospace;
  overflow:hidden;
}
body{display:flex;flex-direction:column}
header{
  height:72px;flex:0 0 72px;
  display:flex;align-items:center;justify-content:space-between;
  padding:0 22px;
  border-bottom:1px solid var(--grid);
  background:#010301;
}
.title{font-size:29px;letter-spacing:.08em;font-weight:700}
.sub{font-size:13px;color:var(--muted);margin-top:4px}
.status{text-align:right;font-size:14px;line-height:1.5;color:var(--muted)}
.live{color:var(--bright)}
.err{color:var(--error)}

main{
  flex:1;min-height:0;
  display:grid;
  grid-template-columns:minmax(0,1fr) 360px;
}
#map{
  width:100%;height:100%;
  background:#010301;
}
.leaflet-container{
  background:#010301;
  font-family:Consolas,Menlo,Monaco,"Courier New",monospace;
}
.leaflet-control-attribution{
  background:rgba(0,0,0,.66)!important;
  color:#82a584!important;
  font-size:10px!important;
}
.leaflet-control-attribution a{color:#9cff81!important}

/* OFM etwas abdunkeln, damit Traffic lesbar bleibt */
.ofm-base-pane{filter:brightness(.48) saturate(.72) contrast(1.12)}
.ofm-aero-pane{filter:brightness(.75) saturate(.9) contrast(1.08)}

.aircraft-icon{
  background:transparent!important;
  border:0!important;
}
.aircraft-symbol{
  position:absolute;left:50%;top:50%;
  width:23px;height:23px;
  transform-origin:50% 50%;
  pointer-events:none;
}
.aircraft-symbol svg{
  width:23px;height:23px;overflow:visible;
}
.aircraft-label{
  position:absolute;
  left:18px;top:-16px;
  width:max-content;
  max-width:235px;
  pointer-events:none;
  color:#b5ff98;
  font-size:12px;
  line-height:1.18;
  text-shadow:0 0 3px #000,0 0 3px #000,1px 1px 1px #000;
  white-space:nowrap;
}
.aircraft-label .small{color:#90bd91;font-size:11px}
.ednx-label{
  color:#b5ff98;font-size:13px;font-weight:700;
  text-shadow:0 0 3px #000,0 0 3px #000;
  white-space:nowrap;
}
.ednx-marker{
  width:12px;height:12px;border-radius:50%;
  border:2px solid #b5ff98;background:#14391d;
  box-shadow:0 0 5px #8fff79;
}

aside{
  border-left:1px solid var(--grid);
  background:#010401;
  padding:14px 16px;
  overflow:auto;
}
aside h2{
  font-size:13px;letter-spacing:.14em;
  color:var(--muted);margin:0 0 10px
}
.flight{
  display:grid;
  grid-template-columns:32px minmax(0,1fr);
  gap:10px;
  padding:11px 0;
  border-top:1px solid #113018;
}
.flight:first-of-type{border-top:0}
.smallIcon{width:28px;height:28px;display:block}
.call{font-size:17px;font-weight:700;color:var(--bright)}
.meta{font-size:12px;color:#81ae84;line-height:1.45;margin-top:3px}

footer{
  min-height:78px;
  display:flex;align-items:center;justify-content:space-between;
  gap:14px;flex-wrap:wrap;
  padding:10px 18px;
  border-top:1px solid var(--grid);
  background:#010301;
}
.controls{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
label{font-size:11px;color:var(--muted);display:flex;align-items:center;gap:6px}
select,button{
  height:44px;
  background:#061007;
  color:var(--bright);
  border:1px solid var(--grid2);
  border-radius:5px;
  padding:0 12px;
  font:inherit;
  font-size:13px;
}
button{cursor:pointer}
button.active{background:#14391d;border-color:#8bcf8d}
button:focus,select:focus{outline:2px solid var(--bright);outline-offset:2px}
#msg{font-size:11px;color:var(--muted);max-width:590px;text-align:right}

@media(max-width:900px){
  main{grid-template-columns:1fr}
  aside{display:none}
  header{height:64px;flex-basis:64px;padding:0 12px}
  .title{font-size:20px}
  footer{min-height:70px;padding:8px 10px}
  #msg{display:none}
}
</style>
</head>

<body>
<header>
  <div>
    <div class="title">EDNX LIVE RADAR</div>
    <div class="sub">OBERSCHLEISSHEIM · ADS-B LIVE</div>
  </div>
  <div class="status">
    <span id="state">● VERBINDE…</span><br>
    <span id="clock">--:--:-- UTC</span> · <span id="age">keine Daten</span>
  </div>
</header>

<main>
  <div id="map" aria-label="EDNX Radar und optionale OpenFlightMaps VFR-Karte"></div>

  <aside>
    <h2 id="listTitle">AIRCRAFT ≤ 5.000 FT · 30 KM</h2>
    <div id="list"></div>
  </aside>
</main>

<footer>
  <div class="controls">
    <label>RADIUS
      <select id="radius">
        <option value="20">20 km</option>
        <option value="30" selected>30 km</option>
        <option value="50">50 km</option>
        <option value="75">75 km</option>
        <option value="100">100 km</option>
      </select>
    </label>

    <label>MAX HÖHE
      <select id="alt">
        <option value="2500">2.500 ft</option>
        <option value="5000" selected>5.000 ft</option>
        <option value="7500">7.500 ft</option>
        <option value="10000">10.000 ft</option>
        <option value="99999">ALLE</option>
      </select>
    </label>

    <label>GROUND EDNX
      <select id="ground">
        <option value="on" selected>AN</option>
        <option value="off">AUS</option>
      </select>
    </label>

    <button id="mapToggle" type="button">VFR MAP: AUS</button>
    <button id="refresh" type="button">AKTUALISIEREN</button>
  </div>

  <div id="msg">Quelle: ADSB.lol · VFR-Karte optional: open flightmaps</div>
</footer>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
 integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>

<script>
(() => {
  const CENTER=[48.239166,11.559334];
  const EDNX_GROUND_RADIUS_KM=1.8;
  const $=id=>document.getElementById(id);

  const radiusSel=$('radius');
  const altSel=$('alt');
  const groundSel=$('ground');
  const mapToggle=$('mapToggle');
  const list=$('list');

  let raw=[];
  let updated=0;
  let busy=false;
  let mapVisible=false;

  // Geo-Historie statt Pixel-Historie: bleibt bei Range-Wechsel korrekt.
  const history=new Map();

  // Leaflet Karte bleibt immer aktiv; nur die VFR-Tiles werden ein/ausgeschaltet.
  const map=L.map('map',{
    center:CENTER,
    zoom:11,
    zoomControl:false,
    attributionControl:true,
    dragging:false,
    touchZoom:false,
    scrollWheelZoom:false,
    doubleClickZoom:false,
    boxZoom:false,
    keyboard:false
  });

  // Separate Panes für Helligkeit/Layer-Reihenfolge.
  map.createPane('ofmBase');
  map.getPane('ofmBase').style.zIndex=200;
  map.getPane('ofmBase').classList.add('ofm-base-pane');

  map.createPane('ofmAero');
  map.getPane('ofmAero').style.zIndex=210;
  map.getPane('ofmAero').classList.add('ofm-aero-pane');

  map.createPane('radarGrid');
  map.getPane('radarGrid').style.zIndex=350;

  map.createPane('trailPane');
  map.getPane('trailPane').style.zIndex=430;

  map.createPane('trafficPane');
  map.getPane('trafficPane').style.zIndex=500;

  // OpenFlightMaps besteht aus Basis- und Aero-Layer.
  const ofmBase=L.tileLayer(
    'https://nwy-tiles-api.prod.newaydata.com/tiles/{z}/{x}/{y}.jpg?path=latest/base/latest',
    {
      minZoom:7,maxZoom:13,
      pane:'ofmBase',
      opacity:1,
      attribution:'© open flightmaps association'
    }
  );

  const ofmAero=L.tileLayer(
    'https://nwy-tiles-api.prod.newaydata.com/tiles/{z}/{x}/{y}.png?path=latest/aero/latest',
    {
      minZoom:7,maxZoom:13,
      pane:'ofmAero',
      opacity:1,
      attribution:'© open flightmaps association'
    }
  );

  const gridGroup=L.layerGroup().addTo(map);
  const trailGroup=L.layerGroup().addTo(map);
  const trafficGroup=L.layerGroup().addTo(map);

  // EDNX Marker
  const ednxIcon=L.divIcon({
    className:'',
    iconSize:[110,28],
    iconAnchor:[6,6],
    html:'<div class="ednx-marker"></div><div class="ednx-label" style="position:absolute;left:17px;top:-2px">EDNX</div>'
  });
  L.marker(CENTER,{icon:ednxIcon,pane:'trafficPane',interactive:false}).addTo(map);

  const rd=d=>d*Math.PI/180;
  const dg=r=>r*180/Math.PI;
  const fmt=n=>Number(n).toLocaleString('de-DE');

  function distanceKm(lat1,lon1,lat2,lon2){
    const R=6371, dLat=rd(lat2-lat1), dLon=rd(lon2-lon1);
    const a=Math.sin(dLat/2)**2+
      Math.cos(rd(lat1))*Math.cos(rd(lat2))*Math.sin(dLon/2)**2;
    return 2*R*Math.asin(Math.sqrt(a));
  }

  function bearing(lat1,lon1,lat2,lon2){
    const y=Math.sin(rd(lon2-lon1))*Math.cos(rd(lat2));
    const x=Math.cos(rd(lat1))*Math.sin(rd(lat2))-
      Math.sin(rd(lat1))*Math.cos(rd(lat2))*Math.cos(rd(lon2-lon1));
    return (dg(Math.atan2(y,x))+360)%360;
  }

  function altitude(ac){
    if(ac.alt_baro==='ground') return 0;
    const n=Number(ac.alt_baro);
    return Number.isFinite(n)?n:null;
  }

  function callsign(ac){return (ac.flight||'').trim()}
  function reg(ac){return (ac.r||'').trim()}
  function type(ac){return (ac.t||'').trim()||'—'}
  function name(ac){return callsign(ac)||reg(ac)||(ac.hex||'').toUpperCase()||'UNBEKANNT'}

  function hdg(ac){
    const vals=[ac.track,ac.true_heading,ac.mag_heading].map(Number);
    const v=vals.find(Number.isFinite);
    return Number.isFinite(v)?((v%360)+360)%360:null;
  }

  function speed(ac){
    const n=Number(ac.gs);
    return Number.isFinite(n)?Math.round(n):null;
  }

  function key(ac){
    return (ac.hex||reg(ac)||callsign(ac)||'unknown').trim();
  }

  function esc(s){
    return String(s).replace(/[&<>"']/g,c=>({
      '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
    }[c]));
  }

  function permittedGround(ac,d){
    const a=altitude(ac);
    if(a!==0)return true;
    if(groundSel.value==='off')return false;
    return d<=EDNX_GROUND_RADIUS_KM;
  }

  function remember(ac){
    const k=key(ac);
    const now=Date.now();
    let arr=history.get(k)||[];

    // Nur bei neuer Datenposition Punkt ergänzen.
    const lat=Number(ac.lat),lon=Number(ac.lon);
    const last=arr[arr.length-1];
    if(!last || Math.abs(last.lat-lat)>0.00001 || Math.abs(last.lon-lon)>0.00001){
      arr.push({lat,lon,t:now});
    }

    arr=arr.filter(p=>now-p.t<120000);
    if(arr.length>24)arr=arr.slice(-24);
    history.set(k,arr);
    return arr;
  }

  function fitRadarRange(){
    const km=Number(radiusSel.value);
    const dLat=km/111.32;
    const dLon=km/(111.32*Math.cos(rd(CENTER[0])));
    const bounds=L.latLngBounds(
      [CENTER[0]-dLat,CENTER[1]-dLon],
      [CENTER[0]+dLat,CENTER[1]+dLon]
    );
    map.fitBounds(bounds,{padding:[24,24],animate:false});
  }

  function drawRadarGrid(){
    gridGroup.clearLayers();
    const maxKm=Number(radiusSel.value);

    // Range-Ringe 25/50/75/100 %
    [0.25,0.5,0.75,1].forEach((f,i)=>{
      L.circle(CENTER,{
        radius:maxKm*1000*f,
        pane:'radarGrid',
        interactive:false,
        color:i===3?'#347343':'#1a4a26',
        weight:i===3?1.2:1,
        opacity:.85,
        fill:false
      }).addTo(gridGroup);
    });

    // N-S / E-W Kreuz über Range hinaus
    const dLat=maxKm/111.32;
    const dLon=maxKm/(111.32*Math.cos(rd(CENTER[0])));
    const lineStyle={
      pane:'radarGrid',
      interactive:false,
      color:'#1f522c',
      weight:1,
      opacity:.8
    };

    L.polyline([
      [CENTER[0]-dLat,CENTER[1]],
      [CENTER[0]+dLat,CENTER[1]]
    ],lineStyle).addTo(gridGroup);

    L.polyline([
      [CENTER[0],CENTER[1]-dLon],
      [CENTER[0],CENTER[1]+dLon]
    ],lineStyle).addTo(gridGroup);
  }

  function aircraftIcon(ac){
    const heading=hdg(ac)??0;
    const c=callsign(ac),r=reg(ac);
    const first=c ? (r ? `${r} · ${c}` : c) : (r||name(ac));
    const a=altitude(ac);
    const s=speed(ac);
    const h=hdg(ac);

    const info=`${a===0?'GND':fmt(a)+' ft'} · ${s===null?'—':s+' kt'} · ${h===null?'—':String(Math.round(h)).padStart(3,'0')+'°'}`;

    return L.divIcon({
      className:'aircraft-icon',
      iconSize:[25,25],
      iconAnchor:[12.5,12.5],
      html:`
        <div class="aircraft-symbol" style="transform:translate(-50%,-50%) rotate(${heading}deg)">
          <svg viewBox="-12 -12 24 24" aria-hidden="true">
            <path d="M0,-10 L2,-2.2 L9.5,1.2 L9.5,3.1 L2.6,2.4 L1.6,9 L-1.6,9 L-2.6,2.4 L-9.5,3.1 L-9.5,1.2 L-2,-2.2 Z"
              fill="none" stroke="#a8ff8e" stroke-width="1.25" stroke-linejoin="round"/>
          </svg>
        </div>
        <div class="aircraft-label">
          ${esc(first)}
          <div class="small">${esc(info)}</div>
        </div>`
    });
  }

  function render(){
    trafficGroup.clearLayers();
    trailGroup.clearLayers();
    list.innerHTML='';

    // EDNX Marker nach clear wieder setzen
    L.marker(CENTER,{icon:ednxIcon,pane:'trafficPane',interactive:false}).addTo(trafficGroup);

    const maxKm=Number(radiusSel.value);
    const maxAlt=Number(altSel.value);

    const visible=raw.map(ac=>{
      if(!Number.isFinite(Number(ac.lat))||!Number.isFinite(Number(ac.lon)))return null;
      const a=altitude(ac);
      if(a===null||a>maxAlt)return null;
      const d=distanceKm(CENTER[0],CENTER[1],Number(ac.lat),Number(ac.lon));
      if(d>maxKm)return null;
      if(!permittedGround(ac,d))return null;
      return {...ac,_alt:a,_dist:d,_bearing:bearing(CENTER[0],CENTER[1],Number(ac.lat),Number(ac.lon))};
    }).filter(Boolean).sort((a,b)=>a._dist-b._dist);

    visible.forEach(ac=>{
      const arr=remember(ac);

      if(arr.length>1){
        L.polyline(arr.map(p=>[p.lat,p.lon]),{
          pane:'trailPane',
          interactive:false,
          color:'#72b374',
          opacity:.67,
          weight:1.25,
          dashArray:'2,6'
        }).addTo(trailGroup);
      }

      L.marker([Number(ac.lat),Number(ac.lon)],{
        icon:aircraftIcon(ac),
        pane:'trafficPane',
        interactive:false
      }).addTo(trafficGroup);

      const c=callsign(ac),r=reg(ac);
      const top=c||r||name(ac);
      const secondary=(c&&r)?r:(type(ac)!=='—'?type(ac):'');

      const div=document.createElement('div');
      div.className='flight';
      div.innerHTML=`
        <svg class="smallIcon" viewBox="-12 -12 24 24" aria-hidden="true">
          <path d="M0,-9 L2,-2 L9,1 L9,3 L2.5,2.5 L1.5,9 L-1.5,9 L-2.5,2.5 L-9,3 L-9,1 L-2,-2 Z"
            fill="none" stroke="#9cff81" stroke-width="1.2"/>
        </svg>
        <div>
          <div class="call">${esc(top)}</div>
          <div class="meta">
            ${secondary?esc(secondary)+' · ':''}${esc(type(ac))}<br>
            ${ac._alt===0?'GROUND':fmt(ac._alt)+' ft'} ·
            ${speed(ac)===null?'—':speed(ac)+' kt'} ·
            ${hdg(ac)===null?'—':String(Math.round(hdg(ac))).padStart(3,'0')+'°'}<br>
            ${ac._dist.toFixed(1)} km · ${Math.round(ac._bearing)}°
          </div>
        </div>`;
      list.appendChild(div);
    });

    $('listTitle').textContent=
      `AIRCRAFT ≤ ${maxAlt>90000?'ALLE':fmt(maxAlt)+' FT'} · ${maxKm} KM · ${visible.length}`;

    $('msg').textContent=
      `${visible.length} angezeigt · ${raw.length} Rohziele · Trail 2 min · VFR Map ${mapVisible?'AN':'AUS'}`;
  }

  function setMapVisible(on){
    mapVisible=on;

    if(on){
      if(!map.hasLayer(ofmBase))ofmBase.addTo(map);
      if(!map.hasLayer(ofmAero))ofmAero.addTo(map);
      mapToggle.textContent='VFR MAP: AN';
      mapToggle.classList.add('active');
    }else{
      if(map.hasLayer(ofmBase))map.removeLayer(ofmBase);
      if(map.hasLayer(ofmAero))map.removeLayer(ofmAero);
      mapToggle.textContent='VFR MAP: AUS';
      mapToggle.classList.remove('active');
    }

    setTimeout(()=>map.invalidateSize(false),50);
    render();
  }

  async function load(){
    if(busy)return;
    busy=true;
    $('state').textContent='● LADE…';
    $('state').className='live';

    try{
      const R=Number(radiusSel.value);
      const res=await fetch(`/.netlify/functions/aircraft?radius=${encodeURIComponent(R)}`,{cache:'no-store'});
      if(!res.ok)throw new Error('HTTP '+res.status);
      const data=await res.json();

      raw=Array.isArray(data.ac)?data.ac:[];
      updated=Date.now();

      $('state').textContent='● LIVE';
      $('state').className='live';
      render();
    }catch(e){
      $('state').textContent='● VERBINDUNGSFEHLER';
      $('state').className='err';
      $('msg').textContent='Fehler: '+e.message;
    }finally{
      busy=false;
    }
  }

  radiusSel.addEventListener('change',()=>{
    fitRadarRange();
    drawRadarGrid();
    render();
    load();
  });

  altSel.addEventListener('change',render);
  groundSel.addEventListener('change',render);

  mapToggle.addEventListener('click',()=>{
    setMapVisible(!mapVisible);
  });

  $('refresh').addEventListener('click',load);

  setInterval(load,10000);
  setInterval(()=>{
    $('clock').textContent=
      new Date().toLocaleTimeString('de-DE',{hour12:false,timeZone:'UTC'})+' UTC';
    $('age').textContent=
      updated?Math.floor((Date.now()-updated)/1000)+' s alt':'keine Daten';
  },1000);

  $('clock').textContent=
    new Date().toLocaleTimeString('de-DE',{hour12:false,timeZone:'UTC'})+' UTC';

  fitRadarRange();
  drawRadarGrid();
  setMapVisible(false);
  load();
})();
</script>
</body>
</html>
