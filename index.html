<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>EDNX Live Radar</title>
<style>
:root{--bg:#020504;--grid:#163421;--grid2:#28523a;--text:#c9f7d6;--muted:#72947d;--bright:#7dff9b;--red:#ff7d7d}
*{box-sizing:border-box}html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:Consolas,Menlo,monospace}
body{display:flex;flex-direction:column;overflow:hidden}header{height:72px;display:flex;justify-content:space-between;align-items:center;padding:0 28px;border-bottom:1px solid var(--grid2)}
h1{font-size:25px;letter-spacing:.08em;margin:0}.sub{font-size:12px;color:var(--muted);margin-top:5px}.stat{text-align:right;color:var(--muted);font-size:13px}.live{color:var(--bright)}.err{color:var(--red)}
main{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) 330px}#wrap{min-width:0;min-height:0}svg{width:100%;height:100%;display:block}
aside{border-left:1px solid var(--grid2);padding:15px;overflow:auto}aside h2{font-size:12px;color:var(--muted);letter-spacing:.12em}.flight{padding:9px 0;border-top:1px solid #102218}.call{font-size:16px;color:var(--bright);font-weight:bold}.meta{font-size:11px;color:#91aa98;line-height:1.45}
footer{min-height:68px;border-top:1px solid var(--grid2);padding:8px 18px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.controls{display:flex;gap:10px;flex-wrap:wrap}label{font-size:11px;color:var(--muted);display:flex;align-items:center;gap:6px}select,button{height:40px;background:#07110b;color:var(--text);border:1px solid var(--grid2);border-radius:5px;padding:0 10px;font:inherit}#msg{font-size:11px;color:var(--muted)}
@media(max-width:800px){header{height:62px;padding:0 12px}h1{font-size:18px}main{grid-template-columns:1fr}aside{display:none}footer{padding:7px 9px}.stat{font-size:11px}}
</style></head>
<body>
<header><div><h1>EDNX LIVE RADAR</h1><div class="sub">OBERSCHLEISSHEIM · ADS-B LIVE</div></div><div class="stat"><span id="state">● VERBINDE…</span><br><span id="clock"></span> · <span id="age">keine Daten</span></div></header>
<main><div id="wrap"><svg viewBox="0 0 1100 720">
<g fill="none" stroke="#163421"><circle cx="550" cy="360" r="85"/><circle cx="550" cy="360" r="170"/><circle cx="550" cy="360" r="255"/><circle cx="550" cy="360" r="330"/><line x1="550" y1="30" x2="550" y2="690"/><line x1="220" y1="360" x2="880" y2="360"/><line x1="317" y1="127" x2="783" y2="593"/><line x1="783" y1="127" x2="317" y2="593"/></g>
<g fill="#668b72" font-size="13"><text x="560" y="45">N</text><text x="895" y="365">E</text><text x="560" y="690">S</text><text x="195" y="365">W</text><text id="r1" x="560" y="280">12.5 km</text><text id="r2" x="560" y="195">25 km</text><text id="r3" x="560" y="110">37.5 km</text><text id="r4" x="560" y="43">50 km</text></g>
<circle cx="550" cy="360" r="5" fill="#d7ffe1"/><circle cx="550" cy="360" r="12" fill="none" stroke="#5b8e68"/><text x="567" y="355" fill="#d7ffe1" font-size="14">EDNX</text><text x="567" y="372" fill="#698d73" font-size="11">1,594 FT MSL</text>
<g id="sweep"><path d="M550 360 L465 41 A330 330 0 0 1 550 30 Z" fill="#54b56e" opacity=".06"/><line x1="550" y1="360" x2="550" y2="30" stroke="#6bd884" opacity=".25"/></g><g id="planes"></g>
</svg></div><aside><h2 id="listTitle">AIRCRAFT ≤ 5.000 FT</h2><div id="list"></div></aside></main>
<footer><div class="controls"><label>RADIUS <select id="radius"><option>20</option><option>30</option><option selected>50</option><option>75</option><option>100</option></select> km</label><label>MAX HÖHE <select id="alt"><option value="2500">2.500 ft</option><option value="5000" selected>5.000 ft</option><option value="7500">7.500 ft</option><option value="10000">10.000 ft</option><option value="99999">ALLE</option></select></label><button id="refresh">AKTUALISIEREN</button></div><div id="msg">ADSB.lol · Netlify Function</div></footer>
<script>
(()=>{const C={lat:48.239166,lon:11.559334},$=x=>document.getElementById(x),P=$('planes'),L=$('list');let raw=[],updated=0,busy=false,rot=0;
const rd=x=>x*Math.PI/180, dg=x=>x*180/Math.PI, fmt=x=>Number(x).toLocaleString('de-DE');
function dist(a,b,c,d){const R=6371,A=rd(c-a),B=rd(d-b),q=Math.sin(A/2)**2+Math.cos(rd(a))*Math.cos(rd(c))*Math.sin(B/2)**2;return 2*R*Math.asin(Math.sqrt(q))}
function bear(a,b,c,d){const y=Math.sin(rd(d-b))*Math.cos(rd(c)),x=Math.cos(rd(a))*Math.sin(rd(c))-Math.sin(rd(a))*Math.cos(rd(c))*Math.cos(rd(d-b));return(dg(Math.atan2(y,x))+360)%360}
function alt(a){if(a.alt_baro==='ground')return 0;const n=Number(a.alt_baro);return Number.isFinite(n)?n:null}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function name(a){return (a.flight||'').trim()||(a.r||'').trim()||(a.hex||'').toUpperCase()||'UNBEKANNT'}
function render(){const R=+$('radius').value,A=+$('alt').value;let v=raw.map(a=>{if(!isFinite(+a.lat)||!isFinite(+a.lon))return null;let h=alt(a);if(h===null||h>A)return null;let d=dist(C.lat,C.lon,+a.lat,+a.lon);if(d>R)return null;return {...a,_a:h,_d:d,_b:bear(C.lat,C.lon,+a.lat,+a.lon)}}).filter(Boolean).sort((a,b)=>a._d-b._d);P.innerHTML='';L.innerHTML='';
v.forEach(a=>{let rr=a._d/R*330,t=rd(a._b),x=550+Math.sin(t)*rr,y=360-Math.cos(t)*rr,hd=isFinite(+a.track)?+a.track:a._b;let g=document.createElementNS('http://www.w3.org/2000/svg','g');g.setAttribute('transform',`translate(${x} ${y}) rotate(${hd})`);g.innerHTML='<path d="M0 -12 L4 -2 L14 5 L14 8 L4 6 L3 15 L-3 15 L-4 6 L-14 8 L-14 5 L-4 -2 Z" fill="#7dff9b"/>';P.appendChild(g);let tx=document.createElementNS('http://www.w3.org/2000/svg','text');tx.setAttribute('x',x+16);tx.setAttribute('y',y-8);tx.setAttribute('font-size','12');tx.innerHTML=`<tspan x="${x+16}" fill="#c9f7d6">${esc(name(a))}</tspan><tspan x="${x+16}" dy="14" fill="#74947d">${fmt(a._a)} ft · ${esc(a.t||'—')}</tspan>`;P.appendChild(tx);let d=document.createElement('div');d.className='flight';d.innerHTML=`<div class="call">${esc(name(a))}</div><div class="meta">${esc(a.t||'—')}${a.r?' · '+esc(a.r):''}<br>${fmt(a._a)} ft · ${isFinite(+a.gs)?Math.round(+a.gs)+' kt':'—'}<br>${a._d.toFixed(1)} km · ${Math.round(a._b)}°</div>`;L.appendChild(d)});
$('listTitle').textContent=`AIRCRAFT ≤ ${A>90000?'ALLE':fmt(A)+' FT'} · ${v.length}`;[$('r1'),$('r2'),$('r3'),$('r4')].forEach((e,i)=>e.textContent=(R*(i+1)/4)+' km');$('msg').textContent=raw.length?`${v.length} angezeigt · ${raw.length} Rohziele empfangen · ADSB.lol`:'Keine Ziele empfangen'}
async function load(){
  if(busy)return; busy=true;
  $('state').textContent='● LADE…'; $('state').className='live';
  try{
    const R=+$('radius').value;
    const res=await fetch(`/.netlify/functions/aircraft?radius=${encodeURIComponent(R)}`,{cache:'no-store'});
    if(!res.ok) throw new Error('HTTP '+res.status);
    const j=await res.json();
    raw=Array.isArray(j.ac)?j.ac:[];
    updated=Date.now();
    $('state').textContent='● LIVE'; $('state').className='live';
    render();
  }catch(e){
    $('state').textContent='● VERBINDUNGSFEHLER'; $('state').className='err';
    $('msg').textContent='Fehler: '+e.message;
  }finally{busy=false}
}
$('radius').addEventListener('change',load);$('alt').addEventListener('change',render);$('refresh').addEventListener('click',load);setInterval(load,10000);setInterval(()=>{$('clock').textContent=new Date().toLocaleTimeString('de-DE',{hour12:false});$('age').textContent=updated?Math.floor((Date.now()-updated)/1000)+' s alt':'keine Daten'},1000);function anim(){rot=(rot+.08)%360;$('sweep').setAttribute('transform',`rotate(${rot} 550 360)`);requestAnimationFrame(anim)}anim();load()})();
</script></body></html>
