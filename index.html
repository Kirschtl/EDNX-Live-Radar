<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>EDNX Live Radar v7.3</title>
<style>
:root{
  --bg:#010301;
  --panel:#020702;
  --grid:#173d20;
  --grid2:#2f6a3a;
  --text:#9cff81;
  --muted:#6f9f70;
  --bright:#b5ff98;
  --error:#ff7777;
  --ctr:#ff69b4;
  --rmz:#4aa8ff;
  --airspace:#8d8d8d;
}
*{box-sizing:border-box}
html,body{
  margin:0;height:100%;
  background:var(--bg);
  color:var(--text);
  font-family:Consolas,Menlo,Monaco,"Courier New",monospace;
  overflow:hidden;
}
body{display:flex;flex-direction:column}
header{
  height:72px;flex:0 0 72px;
  display:flex;align-items:center;justify-content:space-between;
  padding:0 22px;
  border-bottom:1px solid var(--grid);
}
.title{font-size:29px;letter-spacing:.08em;font-weight:700}
.sub{font-size:13px;color:var(--muted);margin-top:4px}
.status{text-align:right;font-size:14px;line-height:1.5;color:var(--muted)}
.live{color:var(--bright)}
.err{color:var(--error)}
main{
  flex:1;min-height:0;
  display:grid;
  grid-template-columns:minmax(0,1fr) 360px;
}
#radarWrap{
  position:relative;
  min-width:0;min-height:0;
  overflow:hidden;
  background:#010301;
}
#radar{width:100%;height:100%;display:block}
aside{
  border-left:1px solid var(--grid);
  background:#010401;
  padding:14px 16px;
  overflow:auto;
}
aside h2{
  font-size:13px;letter-spacing:.14em;
  color:var(--muted);margin:0 0 10px
}
.flight{
  display:grid;
  grid-template-columns:32px minmax(0,1fr);
  gap:10px;
  padding:11px 0;
  border-top:1px solid #113018;
}
.flight:first-of-type{border-top:0}
.smallIcon{width:28px;height:28px;display:block}
.call{font-size:17px;font-weight:700;color:var(--bright)}
.meta{font-size:12px;color:#81ae84;line-height:1.45;margin-top:3px}
footer{
  min-height:78px;
  display:flex;align-items:center;justify-content:space-between;
  gap:14px;flex-wrap:wrap;
  padding:10px 18px;
  border-top:1px solid var(--grid);
}
.controls{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
label{font-size:11px;color:var(--muted);display:flex;align-items:center;gap:6px}
select,button{
  height:44px;
  background:#061007;
  color:var(--bright);
  border:1px solid var(--grid2);
  border-radius:5px;
  padding:0 12px;
  font:inherit;
  font-size:13px;
}
button{cursor:pointer}
button:focus,select:focus{outline:2px solid var(--bright);outline-offset:2px}
#msg{font-size:11px;color:var(--muted);max-width:560px;text-align:right}
@media(max-width:900px){
  main{grid-template-columns:1fr}
  aside{display:none}
  header{height:64px;flex-basis:64px;padding:0 12px}
  .title{font-size:20px}
  footer{min-height:70px;padding:8px 10px}
  #msg{display:none}
}
</style>
</head>
<body>
<header>
  <div>
    <div class="title">EDNX LIVE RADAR</div>
    <div class="sub">OBERSCHLEISSHEIM · ADS-B LIVE</div>
  </div>
  <div class="status">
    <span id="state">● VERBINDE…</span><br>
    <span id="clock">--:--:-- UTC</span> · <span id="age">keine Daten</span>
  </div>
</header>

<main>
  <div id="radarWrap">
    <svg id="radar" viewBox="0 0 1200 780" role="img" aria-label="EDNX Live Radar">
      <!-- rechteckige Radarfläche -->
      <rect x="50" y="30" width="1030" height="700" fill="none" stroke="#2f6a3a" stroke-width="1.2"/>

      <!-- Raster -->
      <g id="grid" fill="none" stroke="#173d20" stroke-width="1">
        <line x1="50" y1="205" x2="1080" y2="205"/>
        <line x1="50" y1="380" x2="1080" y2="380"/>
        <line x1="50" y1="555" x2="1080" y2="555"/>
        <line x1="307.5" y1="30" x2="307.5" y2="730"/>
        <line x1="565" y1="30" x2="565" y2="730"/>
        <line x1="822.5" y1="30" x2="822.5" y2="730"/>
      </g>

      <!-- Hauptachsen -->
      <g fill="none" stroke="#285b33" stroke-width="1.2">
        <line x1="565" y1="30" x2="565" y2="730"/>
        <line x1="50" y1="380" x2="1080" y2="380"/>
      </g>

      <g fill="#5f8d66" font-size="14">
        <text x="555" y="22">N</text>
        <text x="1088" y="385">E</text>
        <text x="555" y="750">S</text>
        <text x="28" y="385">W</text>

        <text id="topRange" x="84" y="54">±30 km</text>
        <text id="gridNorth" x="575" y="55">N +30</text>
        <text id="gridSouth" x="575" y="718">S -30</text>
        <text id="gridWest" x="62" y="370">W -30</text>
        <text id="gridEast" x="1000" y="370">E +30</text>
      </g>

      <!-- EDNX Zentrum -->
      <g>
        <circle cx="565" cy="380" r="5" fill="#b5ff98"/>
        <circle cx="565" cy="380" r="12" fill="none" stroke="#4d8155"/>
        <text x="583" y="375" fill="#b5ff98" font-size="15">EDNX</text>
        <text x="583" y="392" fill="#668c6a" font-size="11">1,594 FT MSL</text>
      </g>

      <defs>
        <clipPath id="radarClip">
          <rect x="50" y="30" width="1030" height="700"/>
        </clipPath>
      </defs>
      <g id="airspaces" clip-path="url(#radarClip)"></g>
      <g id="airspaceLabels" clip-path="url(#radarClip)"></g>
      <g id="trails" clip-path="url(#radarClip)"></g>
      <g id="planes" clip-path="url(#radarClip)"></g>
    </svg>
  </div>

  <aside>
    <h2 id="listTitle">AIRCRAFT ≤ 5.000 FT · 30 KM</h2>
    <div id="list"></div>
  </aside>
</main>

<footer>
  <div class="controls">
    <label>RADIUS
      <select id="radius">
        <option value="10">10 km</option>
        <option value="15">15 km</option>
        <option value="20">20 km</option>
        <option value="30" selected>30 km</option>
        <option value="50">50 km</option>
        <option value="75">75 km</option>
        <option value="100">100 km</option>
      </select>
    </label>
    <label>MAX HÖHE
      <select id="alt">
        <option value="2500">2.500 ft</option>
        <option value="5000" selected>5.000 ft</option>
        <option value="7500">7.500 ft</option>
        <option value="10000">10.000 ft</option>
        <option value="99999">ALLE</option>
      </select>
    </label>
    <label>GROUND EDNX
      <select id="ground">
        <option value="on" selected>AN</option>
        <option value="off">AUS</option>
      </select>
    </label>
    <label>AIRSPACE
      <select id="airspaceMode">
        <option value="off">AUS</option>
        <option value="all" selected>AN</option>
      </select>
    </label>
    <button id="refresh" type="button">AKTUALISIEREN</button>
  </div>
  <div id="msg">Quelle: ADSB.lol · Aktualisierung alle 10 Sekunden</div>
</footer>

<script>
(() => {
  const CENTER={lat:48.239166,lon:11.559334};
  const EDNX_GROUND_RADIUS_KM=1.8;
  const $=id=>document.getElementById(id);
  const planes=$('planes'), trails=$('trails'), list=$('list');
  const airspacesG=$('airspaces'), airspaceLabelsG=$('airspaceLabels');
  const radiusSel=$('radius'), altSel=$('alt'), groundSel=$('ground'), airspaceMode=$('airspaceMode');

  let raw=[], updated=0, busy=false;
  let airspaceItems=[], airspaceBusy=false;

  // Trail-Historie wird in GEO-Koordinaten gespeichert.
  // Dadurch bleibt sie bei Range-Änderungen korrekt und wird neu projiziert.
  const history=new Map();

  const rd=d=>d*Math.PI/180;
  const dg=r=>r*180/Math.PI;
  const fmt=n=>Number(n).toLocaleString('de-DE');

  function distanceKm(lat1,lon1,lat2,lon2){
    const R=6371, dLat=rd(lat2-lat1), dLon=rd(lon2-lon1);
    const a=Math.sin(dLat/2)**2 + Math.cos(rd(lat1))*Math.cos(rd(lat2))*Math.sin(dLon/2)**2;
    return 2*R*Math.asin(Math.sqrt(a));
  }

  function bearing(lat1,lon1,lat2,lon2){
    const y=Math.sin(rd(lon2-lon1))*Math.cos(rd(lat2));
    const x=Math.cos(rd(lat1))*Math.sin(rd(lat2)) -
            Math.sin(rd(lat1))*Math.cos(rd(lat2))*Math.cos(rd(lon2-lon1));
    return (dg(Math.atan2(y,x))+360)%360;
  }

  function altitude(ac){
    if(ac.alt_baro==='ground') return 0;
    const n=Number(ac.alt_baro);
    return Number.isFinite(n)?n:null;
  }

  function callsign(ac){return (ac.flight||'').trim()}
  function reg(ac){return (ac.r||'').trim()}
  function name(ac){return callsign(ac)||reg(ac)||(ac.hex||'').toUpperCase()||'UNBEKANNT'}
  function type(ac){return (ac.t||'').trim()||'—'}

  function hdg(ac){
    const v=[ac.track,ac.true_heading,ac.mag_heading].map(Number).find(Number.isFinite);
    return Number.isFinite(v)?((v%360)+360)%360:null;
  }

  function speed(ac){
    const n=Number(ac.gs);
    return Number.isFinite(n)?Math.round(n):null;
  }

  function key(ac){
    return (ac.hex||reg(ac)||callsign(ac)||Math.random().toString(36)).trim();
  }

  function esc(s){
    return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  function isAllowedGround(ac,d){
    const a=altitude(ac);
    if(a!==0) return true;
    if(groundSel.value==='off') return false;
    return d<=EDNX_GROUND_RADIUS_KM;
  }

  function dataLine(ac){
    const r=reg(ac), c=callsign(ac), a=altitude(ac), s=speed(ac), h=hdg(ac);
    const first=c ? (r ? `${r} · ${c}` : c) : (r || name(ac));
    const second=`${a===null?'—':fmt(a)+' ft'} · ${s===null?'—':s+' kt'} · ${h===null?'—':String(Math.round(h)).padStart(3,'0')+'°'}`;
    return {first,second};
  }

  function rememberPosition(ac){
    const k=key(ac), now=Date.now();
    let arr=history.get(k)||[];
    arr.push({lat:Number(ac.lat),lon:Number(ac.lon),t:now});
    arr=arr.filter(p=>now-p.t<120000);
    if(arr.length>18) arr=arr.slice(-18);
    history.set(k,arr);
    return arr;
  }

  // lokale Ost/Nord-Projektion in km, gut für 20–100 km Radius
  function project(lat,lon,maxKm){
    // Lokale equirektangulare Projektion um EDNX.
    // Wichtig: EAST und NORTH benutzen denselben Pixel/km-Maßstab,
    // damit GeoJSON-Polygone nicht horizontal gestreckt werden.
    const meanLat=rd((lat+CENTER.lat)/2);
    const north=(lat-CENTER.lat)*111.32;
    const east=(lon-CENTER.lon)*111.32*Math.cos(meanLat);

    const pixelsPerKm=350/maxKm; // vertikale Halbausdehnung bestimmt den Maßstab
    const x=565 + east*pixelsPerKm;
    const y=380 - north*pixelsPerKm;
    return {x,y};
  }


  function svgEl(name, attrs={}){
    const el=document.createElementNS('http://www.w3.org/2000/svg',name);
    Object.entries(attrs).forEach(([k,v])=>el.setAttribute(k,String(v)));
    return el;
  }

  function airspaceName(item){
    return String(item?.name || item?.properties?.name || '').trim();
  }

  function classifyAirspace(item){
    const n=airspaceName(item).toUpperCase();
    if(n.includes('RMZ')) return 'rmz';
    if(n.includes('CTR')) return 'ctr';
    return 'other';
  }

  function isLocalDesiredAirspace(item){
    const n=airspaceName(item).toUpperCase()
      .replaceAll('Ü','UE')
      .replaceAll('Ö','OE')
      .replaceAll('Ä','AE')
      .replaceAll('ß','SS');

    const cls=classifyAirspace(item);

    if(cls==='rmz'){
      return n.includes('RMZ EDNX')
        || n.includes('OBERSCHLEISSHEIM')
        || n.includes('SCHLEISSHEIM')
        || n.includes('EDNX');
    }

    if(cls==='ctr'){
      return n.includes('CTR MUENCHEN')
        || n.includes('MUENCHEN')
        || n.includes('MUNICH')
        || n.includes('EDDM')
        || n.includes('CTR SEKTOR EDNX')
        || n.includes('EDNX');
    }

    return false;
  }

  function geometryOf(item){
    return item?.geometry || item?.properties?.geometry || null;
  }

  function ringsFromGeometry(geom){
    if(!geom || !geom.type || !Array.isArray(geom.coordinates)) return [];
    if(geom.type==='Polygon') return geom.coordinates;
    if(geom.type==='MultiPolygon') return geom.coordinates.flat();
    return [];
  }

  function projectLonLat(lon,lat,maxKm){
    return project(Number(lat),Number(lon),maxKm);
  }

  function renderAirspaces(){
    airspacesG.innerHTML='';
    airspaceLabelsG.innerHTML='';
    const mode=airspaceMode.value;
    if(mode==='off') return;

    const maxKm=Number(radiusSel.value);
    const shown = mode==='all' ? airspaceItems : [];

    shown.forEach(item=>{
      const geom=geometryOf(item);
      const rings=ringsFromGeometry(geom);
      if(!rings.length) return;

      const cls=classifyAirspace(item);
      const stroke=cls==='ctr'?'#ff69b4':(cls==='rmz'?'#4aa8ff':'#7f8b80');
      const width=cls==='other'?1.0:1.8;
      const dash=cls==='rmz'?'7 5':(cls==='other'?'4 6':'');
      const opacity=cls==='other'?.45:.95;

      let labelPts=[];

      rings.forEach(ring=>{
        const pts=ring
          .filter(c=>Array.isArray(c)&&c.length>=2)
          .map(c=>projectLonLat(c[0],c[1],maxKm));

        if(pts.length<2) return;
        labelPts.push(...pts);

        const poly=svgEl('polyline',{
          points:pts.map(p=>`${p.x},${p.y}`).join(' '),
          fill:'none',
          stroke,
          'stroke-width':width,
          opacity,
          'stroke-linejoin':'round',
          'stroke-linecap':'round'
        });
        if(dash) poly.setAttribute('stroke-dasharray',dash);
        airspacesG.appendChild(poly);
      });

      if(labelPts.length && cls!=='other'){
        const inView=labelPts.filter(p=>p.x>=70&&p.x<=1060&&p.y>=50&&p.y<=710);
        if(inView.length){
          const x=inView.reduce((s,p)=>s+p.x,0)/inView.length;
          const y=inView.reduce((s,p)=>s+p.y,0)/inView.length;
          const t=svgEl('text',{
            x,y,
            fill:stroke,
            'font-size':11,
            'font-weight':'700',
            'text-anchor':'middle'
          });
          t.textContent=airspaceName(item);
          airspaceLabelsG.appendChild(t);
        }
      }
    });
  }

  async function loadAirspaces(){
    if(airspaceBusy || airspaceMode.value==='off') {
      renderAirspaces();
      return;
    }
    airspaceBusy=true;
    try{
      const R=Math.max(50,Number(radiusSel.value));
      const res=await fetch(`/.netlify/functions/airspaces?radius=${encodeURIComponent(R)}`,{cache:'no-store'});
      if(!res.ok) throw new Error('HTTP '+res.status);
      const data=await res.json();
      airspaceItems=Array.isArray(data.items)?data.items:[];
      renderAirspaces();
    }catch(e){
      airspaceItems=[];
      renderAirspaces();
      $('msg').textContent='Airspace-Fehler: '+e.message;
    }finally{
      airspaceBusy=false;
    }
  }

  function isHelicopter(ac){
    const cat=String(ac.category||'').toUpperCase();
    const t=String(ac.t||'').toUpperCase().replace(/[^A-Z0-9]/g,'');
    // ADS-B emitter category A7 = rotorcraft.
    if(cat==='A7') return true;
    // Fallback for common ICAO helicopter type designators.
    return /^(R22|R44|R66|EC20|EC25|EC30|EC35|EC45|EC55|EC75|H120|H125|H130|H135|H145|H155|H160|H175|H215|H225|AS50|AS55|AS65|B06|B212|B412|B429|BK17|S76|S92|A109|A119|A139|A169|A189|NH90|UH60|CH47)$/.test(t);
  }

  function aircraftSvgPath(ac,small=false){
    if(isHelicopter(ac)){
      // Filigrane Draufsicht: Rotor, Rumpf, Heckausleger und Heckrotor.
      return small
        ? 'M-8,0 L8,0 M0,-8 L0,8 M-5,-5 L5,5 M5,-5 L-5,5 M-2,-2 C2,-3 4,-1 3,2 C2,4 0,5 -2,4 C-4,3 -4,0 -2,-2 Z M0,4 L0,10 M-3,10 L3,10 M2,8 L2,12'
        : 'M-10,0 L10,0 M0,-10 L0,10 M-6,-6 L6,6 M6,-6 L-6,6 M-2.5,-2.5 C2.5,-3.5 5,-1 4,2.5 C3,5 0,6 -2.5,5 C-5,3.5 -5,0 -2.5,-2.5 Z M0,5 L0,13 M-4,13 L4,13 M3,10 L3,16';
    }
    return small
      ? 'M0,-9 L2,-2 L9,1 L9,3 L2.5,2.5 L1.5,9 L-1.5,9 L-2.5,2.5 L-9,3 L-9,1 L-2,-2 Z'
      : 'M0,-11 L2.2,-2.2 L10,1.5 L10,3.5 L2.8,2.7 L1.8,10 L-1.8,10 L-2.8,2.7 L-10,3.5 L-10,1.5 L-2.2,-2.2 Z';
  }

  function render(){
    const maxKm=Number(radiusSel.value), maxAlt=Number(altSel.value);

    const visible=raw.map(ac=>{
      if(!Number.isFinite(Number(ac.lat))||!Number.isFinite(Number(ac.lon))) return null;
      const a=altitude(ac);
      if(a===null||a>maxAlt) return null;
      const d=distanceKm(CENTER.lat,CENTER.lon,Number(ac.lat),Number(ac.lon));
      if(d>maxKm) return null;
      if(!isAllowedGround(ac,d)) return null;
      return {...ac,_alt:a,_dist:d,_bear:bearing(CENTER.lat,CENTER.lon,Number(ac.lat),Number(ac.lon))};
    }).filter(Boolean).sort((a,b)=>a._dist-b._dist);

    planes.innerHTML='';
    trails.innerHTML='';
    list.innerHTML='';
    renderAirspaces();

    visible.forEach(ac=>{
      const p=project(Number(ac.lat),Number(ac.lon),maxKm);
      const heading=hdg(ac)??ac._bear;

      const arr=rememberPosition(ac);

      // Alte Spuren immer anhand der GEO-Koordinaten neu projizieren.
      if(arr.length>1){
        const pts=arr
          .map(h=>project(h.lat,h.lon,maxKm))
          .filter(pt=>pt.x>=50&&pt.x<=1080&&pt.y>=30&&pt.y<=730);

        if(pts.length>1){
          const pl=document.createElementNS('http://www.w3.org/2000/svg','polyline');
          pl.setAttribute('points',pts.map(pt=>`${pt.x},${pt.y}`).join(' '));
          pl.setAttribute('fill','none');
          pl.setAttribute('stroke','#6fae70');
          pl.setAttribute('stroke-width','1.2');
          pl.setAttribute('stroke-dasharray','2 5');
          pl.setAttribute('opacity','.68');
          trails.appendChild(pl);
        }
      }

      const g=document.createElementNS('http://www.w3.org/2000/svg','g');
      g.setAttribute('transform',`translate(${p.x} ${p.y}) rotate(${heading})`);
      g.innerHTML=`
        <path d="${aircraftSvgPath(ac,false)}"
              fill="none" stroke="#9cff81" stroke-width="1.25" stroke-linejoin="round" stroke-linecap="round"/>
      `;
      planes.appendChild(g);

      const dl=dataLine(ac);
      const tx=document.createElementNS('http://www.w3.org/2000/svg','text');
      tx.setAttribute('x',p.x+15);
      tx.setAttribute('y',p.y-9);
      tx.setAttribute('font-size','11.5');
      tx.innerHTML=`
        <tspan x="${p.x+15}" fill="#b5ff98">${esc(dl.first)}</tspan>
        <tspan x="${p.x+15}" dy="14" fill="#7ea77f">${esc(dl.second)}</tspan>`;
      planes.appendChild(tx);

      const div=document.createElement('div');
      div.className='flight';
      const c=callsign(ac), r=reg(ac);
      const top=c||r||name(ac);
      const secondary=(c&&r)?r:(type(ac)!=='—'?type(ac):'');
      div.innerHTML=`
        <svg class="smallIcon" viewBox="-12 -12 24 24" aria-hidden="true">
          <path d="${aircraftSvgPath(ac,true)}"
            fill="none" stroke="#9cff81" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <div>
          <div class="call">${esc(top)}</div>
          <div class="meta">${secondary?esc(secondary)+' · ':''}${esc(type(ac))}<br>
          ${ac._alt===0?'GROUND':fmt(ac._alt)+' ft'} · ${speed(ac)===null?'—':speed(ac)+' kt'} · ${hdg(ac)===null?'—':String(Math.round(hdg(ac))).padStart(3,'0')+'°'}<br>
          ${ac._dist.toFixed(1)} km · ${Math.round(ac._bear)}°</div>
        </div>`;
      list.appendChild(div);
    });

    $('listTitle').textContent=`AIRCRAFT ≤ ${maxAlt>90000?'ALLE':fmt(maxAlt)+' FT'} · ${maxKm} KM · ${visible.length}`;
    $('topRange').textContent=`±${maxKm} km`;
    $('gridNorth').textContent=`N +${maxKm}`;
    $('gridSouth').textContent=`S -${maxKm}`;
    $('gridWest').textContent=`W -${maxKm}`;
    $('gridEast').textContent=`E +${maxKm}`;

    $('msg').textContent=raw.length
      ? `${visible.length} angezeigt · ${raw.length} Rohziele · Trail 2 min · Ground nur EDNX · Airspace ${airspaceMode.options[airspaceMode.selectedIndex].text} · Projektion 1:1`
      : 'Keine Ziele empfangen';
  }

  async function load(){
    if(busy)return;
    busy=true;
    $('state').textContent='● LADE…';
    $('state').className='live';

    try{
      const R=Number(radiusSel.value);
      const res=await fetch(`/.netlify/functions/aircraft?radius=${encodeURIComponent(R)}`,{cache:'no-store'});
      if(!res.ok) throw new Error('HTTP '+res.status);
      const data=await res.json();
      raw=Array.isArray(data.ac)?data.ac:[];
      updated=Date.now();
      $('state').textContent='● LIVE';
      $('state').className='live';
      render();
    }catch(e){
      $('state').textContent='● VERBINDUNGSFEHLER';
      $('state').className='err';
      $('msg').textContent='Fehler: '+e.message;
    }finally{
      busy=false;
    }
  }

  radiusSel.addEventListener('change',()=>{
    // Trail und Lufträume werden auf die neue Range neu projiziert.
    render();
    load();
    loadAirspaces();
  });
  altSel.addEventListener('change',render);
  groundSel.addEventListener('change',render);
  airspaceMode.addEventListener('change',()=>{
    renderAirspaces();
    if(airspaceMode.value!=='off' && !airspaceItems.length) loadAirspaces();
  });
  $('refresh').addEventListener('click',()=>{
    load();
    loadAirspaces();
  });

  setInterval(load,10000);
  setInterval(()=>{
    $('clock').textContent=new Date().toLocaleTimeString('de-DE',{hour12:false,timeZone:'UTC'})+' UTC';
    $('age').textContent=updated?Math.floor((Date.now()-updated)/1000)+' s alt':'keine Daten';
  },1000);

  $('clock').textContent=new Date().toLocaleTimeString('de-DE',{hour12:false,timeZone:'UTC'})+' UTC';
  load();
  loadAirspaces();
})();
</script>
</body>
</html>
